name: Build Linux Kernel

# 僅手動觸發
on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Kernel 來源"
        type: choice
        default: "mainline"
        options:
          - mainline   # torvalds/linux：vX.Y 與 vX.Y-rcN
          - stable     # gregkh/linux：stable/LTS 點版，如 v6.12.111
          - custom     # 用下方 kernel_repo_custom 指定
      kernel_repo_custom:
        description: "自訂 repo URL（kernel_source=custom 時使用）"
        type: string
        default: ""
      kernel_ref:
        description: "Tag/branch/commit（留空=自動抓最新 release tag；bare 版本號會自動補 v）"
        type: string
        default: ""
      arch:
        description: "目標架構"
        type: choice
        default: "x86_64"
        options:
          - x86_64
          - arm64
          - riscv64
      config_base:
        description: "基底 config：syzbot 廣譜（驅動多、編較久）或精簡 defconfig"
        type: choice
        default: "syzbot"
        options:
          - syzbot
          - defconfig
      build_kasan:
        description: "Build KASAN 版本"
        type: boolean
        default: true
      build_nokasan:
        description: "Build no-KASAN 版本"
        type: boolean
        default: true
      build_symbol:
        description: "Build symbol（debug info）版本"
        type: boolean
        default: true

jobs:
  # --- 解析版本與要 build 的變體清單 ---
  prepare:
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.resolve.outputs.repo }}
      ref: ${{ steps.resolve.outputs.ref }}
      variants: ${{ steps.variants.outputs.list }}
    steps:
      - name: 解析 kernel repo 與 ref
        id: resolve
        run: |
          set -euo pipefail
          # 由 kernel_source 決定 repo
          case "${{ inputs.kernel_source }}" in
            mainline) REPO="https://github.com/torvalds/linux.git" ;;
            stable)   REPO="https://github.com/gregkh/linux.git" ;;
            custom)
              REPO="${{ inputs.kernel_repo_custom }}"
              [ -n "$REPO" ] || { echo "kernel_source=custom 但未填 kernel_repo_custom" >&2; exit 1; }
              ;;
            *) echo "未知 kernel_source" >&2; exit 1 ;;
          esac
          echo "repo: $REPO"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

          REF="${{ inputs.kernel_ref }}"
          if [ -z "$REF" ]; then
            echo "未指定 ref，抓最新 release tag..."
            REF=$(git ls-remote --tags --refs "$REPO" \
              | grep -oE 'refs/tags/v[0-9]+\.[0-9]+(\.[0-9]+)?$' \
              | sed 's#refs/tags/##' \
              | sort -V \
              | tail -1)
          fi
          echo "選用 ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: 組出變體清單
        id: variants
        run: |
          set -euo pipefail
          items=()
          [ "${{ inputs.build_kasan }}" = "true" ]   && items+=('"kasan"')
          [ "${{ inputs.build_nokasan }}" = "true" ] && items+=('"nokasan"')
          [ "${{ inputs.build_symbol }}" = "true" ]  && items+=('"symbol"')
          if [ ${#items[@]} -eq 0 ]; then
            echo "至少要選一個變體" >&2
            exit 1
          fi
          list="[$(IFS=,; echo "${items[*]}")]"
          echo "variants=$list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  # --- 平行 build 各變體 ---
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.prepare.outputs.variants) }}
    name: build-${{ matrix.variant }}
    steps:
      - name: Checkout 此 repo（取得 configs 與 scripts）
        uses: actions/checkout@v4

      - name: 安裝編譯相依套件
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libssl-dev libelf-dev libdw-dev \
            bc cpio kmod rsync dwarves zstd
          if [ "${{ inputs.arch }}" = "arm64" ]; then
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
          fi
          if [ "${{ inputs.arch }}" = "riscv64" ]; then
            sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu
          fi

      - name: Shallow fetch kernel 原始碼
        run: |
          set -euo pipefail
          REPO="${{ needs.prepare.outputs.repo }}"
          REF="${{ needs.prepare.outputs.ref }}"
          # bare 版本號（含點、開頭為數字）自動補上 v 前綴：6.12.111 -> v6.12.111
          # commit SHA 不含點，不受影響
          if printf '%s' "$REF" | grep -qE '^[0-9]+\.[0-9]'; then
            REF="v$REF"
            echo "偵測到 bare 版本號，改用 tag: $REF" >&2
          fi
          echo "fetch $REPO @ $REF"
          # 用 fetch 而非 clone --branch，才能同時支援 tag / branch / commit SHA
          mkdir linux && cd linux
          git init -q
          git remote add origin "$REPO"
          if ! git fetch --depth 1 origin "$REF"; then
            echo "直接 fetch ref 失敗，改以 tag 參照再試" >&2
            git fetch --depth 1 origin "+refs/tags/$REF:refs/tags/$REF" || {
              echo "==================================================================" >&2
              echo "無法 fetch ref: $REF" >&2
              echo "常見原因：" >&2
              echo "  1) tag 少了 v 前綴（已自動嘗試補上）" >&2
              echo "  2) repo 不含此 ref。stable/LTS 點版（如 v6.12.111）不在 mainline，" >&2
              echo "     請把 kernel_source 選為 stable（gregkh/linux）" >&2
              echo "==================================================================" >&2
              exit 1
            }
          fi
          git checkout -q FETCH_HEAD
          echo "checked out: $(git rev-parse HEAD)"

      - name: Build
        run: |
          set -euo pipefail
          BASE_CONFIG=""
          if [ "${{ inputs.config_base }}" = "syzbot" ]; then
            if [ "${{ inputs.arch }}" = "x86_64" ]; then
              # syzbot 上游廣譜 config（x86_64，含 KASAN/KCOV；變體 fragment 會再調整）
              BASE_CONFIG="https://raw.githubusercontent.com/google/syzkaller/master/dashboard/config/linux/upstream-apparmor-kasan.config"
            else
              echo "syzbot 廣譜 config 目前只內建 x86_64，${{ inputs.arch }} 改用 defconfig" >&2
            fi
          fi
          VARIANT="${{ matrix.variant }}" \
          TARGET_ARCH="${{ inputs.arch }}" \
          SRC_DIR="./linux" \
          OUT_DIR="./out" \
          BASE_CONFIG="$BASE_CONFIG" \
          ./scripts/build-kernel.sh

      - name: 上傳產物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.arch }}-${{ needs.prepare.outputs.ref }}-${{ matrix.variant }}
          path: out/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 14
